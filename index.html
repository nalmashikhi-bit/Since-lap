<style>
/* Layout: a full-bleed WebXR scene. Three lab stations share one stage and each has its own accent. In 2D mode a single hint line floats at the bottom. */
:root {
  --ink: #070a1f;
  --panel: #101743;
  --text: #eef1ff;
  --space: #ffb347;
  --chem: #5ee6c1;
  --body: #ff6b81;
  --good: #4ade80;
  --bad: #ff7a8a;
  --font-display: 'Lalezar', 'Cairo', Tahoma, sans-serif;
  --font-body: 'Cairo', Tahoma, sans-serif;
  color-scheme: dark;
}
html, body { background: var(--ink); color: var(--text); font-family: var(--font-body); }
#hint {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 5;
  direction: rtl;
  text-align: center;
  font-size: 14px;
  line-height: 1.6;
  color: var(--text);
  padding-top: 10px;
  padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: linear-gradient(to top, rgba(7, 10, 31, 0.85), rgba(7, 10, 31, 0));
  pointer-events: none;
  transition: opacity 0.6s ease;
}
#hint.gone { opacity: 0; }
</style>

<script src="https://cdn.jsdelivr.net/npm/aframe@1.5.0/dist/aframe.min.js"></script>
<script>
/* Components: canvas text that supports Arabic shaping, and a star field. */
(function () {
  var THREE = AFRAME.THREE;

  function roundRect(ctx, x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function wrap(ctx, text, maxW) {
    var out = [];
    String(text).split("\n").forEach(function (para) {
      if (para === "") { out.push(""); return; }
      var words = para.split(" "), line = "";
      words.forEach(function (w) {
        var t = line ? line + " " + w : w;
        if (ctx.measureText(t).width > maxW && line) { out.push(line); line = w; }
        else { line = t; }
      });
      out.push(line);
    });
    return out;
  }

  function stack(f) { return "'" + f + "', Cairo, Tahoma, sans-serif"; }

  AFRAME.registerComponent("ctext", {
    schema: {
      text: { default: "" },
      title: { default: "" },
      titleColor: { default: "#ffb347" },
      titleFont: { default: "Lalezar" },
      w: { default: 2 },
      h: { default: 0.5 },
      size: { default: 48 },
      color: { default: "#eef1ff" },
      bg: { default: "" },
      border: { default: "" },
      radius: { default: 40 },
      font: { default: "Cairo" },
      weight: { default: "600" },
      ppu: { default: 360 },
      lh: { default: 1.4 }
    },
    init: function () {
      this.canvas = document.createElement("canvas");
      this.ctx = this.canvas.getContext("2d");
      this.tex = new THREE.CanvasTexture(this.canvas);
      if (THREE.SRGBColorSpace) { this.tex.colorSpace = THREE.SRGBColorSpace; }
      this.tex.anisotropy = 8;
      this.mesh = new THREE.Mesh(
        new THREE.PlaneGeometry(1, 1),
        new THREE.MeshBasicMaterial({ map: this.tex, transparent: true, depthWrite: false, toneMapped: false })
      );
      this.el.setObject3D("mesh", this.mesh);
    },
    update: function () {
      var d = this.data;
      var w = Math.max(8, Math.round(d.w * d.ppu));
      var h = Math.max(8, Math.round(d.h * d.ppu));
      if (this.canvas.width !== w || this.canvas.height !== h) {
        this.canvas.width = w;
        this.canvas.height = h;
        this.tex.dispose();
      }
      this.mesh.scale.set(d.w, d.h, 1);
      this.draw();
    },
    draw: function () {
      var d = this.data, c = this.canvas, ctx = this.ctx, W = c.width, H = c.height;
      ctx.clearRect(0, 0, W, H);
      if (d.bg) { ctx.fillStyle = d.bg; roundRect(ctx, 0, 0, W, H, d.radius); ctx.fill(); }
      if (d.border) { ctx.lineWidth = 7; ctx.strokeStyle = d.border; roundRect(ctx, 4, 4, W - 8, H - 8, d.radius); ctx.stroke(); }
      ctx.direction = "rtl";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      var padX = d.size * 0.9, maxW = W - padX * 2, items = [];
      var tsz = Math.round(d.size * 1.3), tf = tsz + "px " + stack(d.titleFont);
      var bf = d.weight + " " + d.size + "px " + stack(d.font);
      if (d.title) {
        ctx.font = tf;
        wrap(ctx, d.title, maxW).forEach(function (l) { items.push({ t: l, f: tf, c: d.titleColor, h: tsz * d.lh }); });
      }
      if (d.text) {
        ctx.font = bf;
        wrap(ctx, d.text, maxW).forEach(function (l) { items.push({ t: l, f: bf, c: d.color, h: d.size * d.lh }); });
      }
      var total = 0;
      items.forEach(function (it) { total += it.h; });
      var y = (H - total) / 2;
      items.forEach(function (it) {
        ctx.font = it.f;
        ctx.fillStyle = it.c;
        ctx.fillText(it.t, W / 2, y + it.h / 2);
        y += it.h;
      });
      this.tex.needsUpdate = true;
    },
    remove: function () {
      this.el.removeObject3D("mesh");
      this.tex.dispose();
      this.mesh.geometry.dispose();
      this.mesh.material.dispose();
    }
  });

  AFRAME.registerComponent("starfield", {
    schema: { count: { default: 1100 }, radius: { default: 70 } },
    init: function () {
      var n = this.data.count, pos = new Float32Array(n * 3), col = new Float32Array(n * 3);
      for (var i = 0; i < n; i++) {
        var u = Math.random() * 2 - 1, th = Math.random() * Math.PI * 2;
        var r = this.data.radius * (0.7 + Math.random() * 0.3), s = Math.sqrt(1 - u * u);
        pos[i * 3] = r * s * Math.cos(th);
        pos[i * 3 + 1] = Math.abs(u) * r * 0.95 + 2;
        pos[i * 3 + 2] = r * s * Math.sin(th);
        var b = 0.5 + Math.random() * 0.5, warm = Math.random() < 0.25;
        col[i * 3] = warm ? b : b * 0.8;
        col[i * 3 + 1] = warm ? b * 0.85 : b * 0.9;
        col[i * 3 + 2] = warm ? b * 0.6 : b;
      }
      var g = new THREE.BufferGeometry();
      g.setAttribute("position", new THREE.BufferAttribute(pos, 3));
      g.setAttribute("color", new THREE.BufferAttribute(col, 3));
      var m = new THREE.PointsMaterial({ size: 0.45, vertexColors: true, sizeAttenuation: true, fog: false, transparent: true, opacity: 0.95 });
      this.el.setObject3D("stars", new THREE.Points(g, m));
    }
  });
})();
</script>

<a-scene id="scene" renderer="antialias: true" loading-screen="dotsColor: #ffb347; backgroundColor: #070a1f" cursor="rayOrigin: mouse; fuse: false" raycaster="objects: .clickable" vr-mode-ui="enabled: true">
  <a-sky id="sky" color="#0a0f33"></a-sky>
  <a-entity starfield animation="property: rotation; to: 0 360 0; dur: 1200000; easing: linear; loop: true"></a-entity>

  <a-entity light="type: ambient; color: #9fb0ff; intensity: 0.75"></a-entity>
  <a-entity light="type: directional; color: #ffffff; intensity: 0.8" position="2 6 3"></a-entity>
  <a-entity id="glow" light="type: point; color: #ffb347; intensity: 1.1; distance: 16; decay: 1.5" position="0 3.2 -2"></a-entity>

  <a-circle rotation="-90 0 0" radius="18" material="color: #0b1030; roughness: 1; metalness: 0"></a-circle>
  <a-ring id="ring1" rotation="-90 0 0" position="0 0.01 0" radius-inner="3.0" radius-outer="3.05" material="shader: flat; color: #ffb347"></a-ring>
  <a-ring id="ring2" rotation="-90 0 0" position="0 0.01 0" radius-inner="4.6" radius-outer="4.63" material="shader: flat; color: #ffb347; opacity: 0.55; transparent: true"></a-ring>
  <a-ring id="ring3" rotation="-90 0 0" position="0 0.01 0" radius-inner="6.4" radius-outer="6.42" material="shader: flat; color: #ffb347; opacity: 0.3; transparent: true"></a-ring>

  <a-entity id="rig" position="0 0 0">
    <a-entity camera="fov: 75" look-controls="pointerLockEnabled: false" position="0 1.6 0">
      <a-entity id="gaze" visible="false" position="0 0 -1"
        cursor="fuse: true; fuseTimeout: 1500"
        raycaster="objects: .clickable; far: 14; enabled: false"
        geometry="primitive: ring; radiusInner: 0.012; radiusOuter: 0.02"
        material="color: #ffffff; shader: flat; opacity: 0.9"
        animation__fuse="property: scale; startEvents: fusing; easing: easeInCubic; dur: 1500; from: 1 1 1; to: 0.25 0.25 0.25"
        animation__leave="property: scale; startEvents: mouseleave; easing: easeOutCubic; dur: 200; to: 1 1 1"></a-entity>
    </a-entity>
    <a-entity id="lhand" laser-controls="hand: left" raycaster="objects: .clickable; far: 14"></a-entity>
    <a-entity id="rhand" laser-controls="hand: right" raycaster="objects: .clickable; far: 14"></a-entity>
  </a-entity>

  <a-entity id="backdrop"></a-entity>
  <a-entity id="ui"></a-entity>
</a-scene>

<div id="hint">اسحب للتلفّت وانقر على الإجابة الصحيحة. وإذا ظهر زر النظارة أسفل الشاشة، اضغطه للدخول بالواقع الافتراضي.</div>

<script>
/* Game logic: intro, six questions across three stations, result. */
(function () {
  var scene = document.getElementById("scene");
  var ui = document.getElementById("ui");
  var bd = document.getElementById("backdrop");
  var css = getComputedStyle(document.documentElement);
  function tok(n) { return css.getPropertyValue(n).trim(); }

  var INK = tok("--ink"), PANEL = tok("--panel"), TEXT = tok("--text"), GOOD = tok("--good"), BAD = tok("--bad");
  var STATIONS = {
    space: { name: "محطة الفضاء", color: tok("--space"), sky: "#0a0f33", floor: "#0b1030" },
    chem: { name: "محطة الكيمياء", color: tok("--chem"), sky: "#061f2a", floor: "#08202a" },
    body: { name: "محطة جسم الإنسان", color: tok("--body"), sky: "#2a0c24", floor: "#240b20" }
  };
  var LIQUID = { teal: "#36e0b5", violet: "#a77bff", amber: "#ffb347" };

  var QUESTIONS = [
    { st: "space", q: "أي كوكب يُعرف باسم الكوكب الأحمر؟",
      opts: [{ k: "planet", p: "mars", l: "المريخ", ok: 1 }, { k: "planet", p: "mercury", l: "عطارد" }, { k: "planet", p: "earth", l: "الأرض" }],
      fact: "يبدو المريخ أحمر لأن تربته غنية بأكسيد الحديد، أي الصدأ." },
    { st: "space", q: "ما أكبر كوكب في المجموعة الشمسية؟",
      opts: [{ k: "planet", p: "jupiter", l: "المشتري", ok: 1 }, { k: "planet", p: "venus", l: "الزهرة" }, { k: "planet", p: "earth", l: "الأرض" }],
      fact: "كتلة المشتري أكبر من كتلة جميع الكواكب الأخرى مجتمعة." },
    { st: "chem", q: "يتكوّن الماء من ذرتي هيدروجين وذرة من أي عنصر؟",
      opts: [{ k: "flask", p: "teal", l: "الأكسجين", ok: 1 }, { k: "flask", p: "violet", l: "الكربون" }, { k: "flask", p: "amber", l: "النيتروجين" }],
      fact: "لهذا تُكتب صيغة الماء H2O، وهو الجزيء الذي يدور خلفك." },
    { st: "chem", q: "عند أي درجة حرارة يغلي الماء النقي عند مستوى سطح البحر؟",
      opts: [{ k: "flask", p: "amber", l: "50 درجة سلسيوس" }, { k: "flask", p: "teal", l: "100 درجة سلسيوس", ok: 1 }, { k: "flask", p: "violet", l: "150 درجة سلسيوس" }],
      fact: "في قمم الجبال يغلي الماء عند درجة أقل لأن الضغط الجوي أقل." },
    { st: "body", q: "أي عضو يضخ الدم إلى جميع أنحاء الجسم؟",
      opts: [{ k: "heart", l: "القلب", ok: 1 }, { k: "lungs", l: "الرئتان" }, { k: "stomach", l: "المعدة" }],
      fact: "يخفق قلب الإنسان نحو 100 ألف مرة في اليوم الواحد." },
    { st: "body", q: "أي عضو يتحكم في التفكير والذاكرة والحركة؟",
      opts: [{ k: "stomach", l: "المعدة" }, { k: "brain", l: "الدماغ", ok: 1 }, { k: "lungs", l: "الرئتان" }],
      fact: "الدماغ جزء صغير من وزن الجسم، لكنه يستهلك نحو خُمس طاقته." }
  ];

  var state = { i: 0, score: 0, res: [], locked: false, station: null };

  function mk(tag, attrs, parent) {
    var e = document.createElement(tag);
    for (var k in attrs) { e.setAttribute(k, attrs[k]); }
    (parent || scene).appendChild(e);
    return e;
  }
  function clearUI() { while (ui.firstChild) { ui.removeChild(ui.firstChild); } }
  function rand(a, b) { return a + Math.random() * (b - a); }
  function shuffle(a) {
    var r = a.slice();
    for (var i = r.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = r[i]; r[i] = r[j]; r[j] = t; }
    return r;
  }

  /* Sound */
  var ac;
  function beep(freqs) {
    try {
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      var t = ac.currentTime, dur = 0.12;
      freqs.forEach(function (f, i) {
        var o = ac.createOscillator(), g = ac.createGain();
        o.type = "sine"; o.frequency.value = f;
        g.gain.setValueAtTime(0.0001, t + i * dur);
        g.gain.exponentialRampToValueAtTime(0.18, t + i * dur + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, t + i * dur + dur);
        o.connect(g); g.connect(ac.destination);
        o.start(t + i * dur); o.stop(t + i * dur + dur + 0.02);
      });
    } catch (e) { /* audio is optional */ }
  }

  function burst(x, y, z, color) {
    for (var i = 0; i < 18; i++) {
      var a = Math.random() * Math.PI * 2, r = 0.6 + Math.random() * 0.9, dy = (Math.random() - 0.2) * 1.2;
      var p = mk("a-sphere", { radius: 0.045, position: x + " " + y + " " + z, material: "shader: flat; color: " + (i % 2 ? color : "#ffffff") }, ui);
      p.setAttribute("animation__m", "property: position; to: " + (x + Math.cos(a) * r) + " " + (y + dy) + " " + (z + Math.sin(a) * r * 0.5) + "; dur: 900; easing: easeOutCubic");
      p.setAttribute("animation__s", "property: scale; to: 0 0 0; dur: 900; delay: 200; easing: easeInQuad");
      (function (n) { setTimeout(function () { if (n.parentNode) { n.parentNode.removeChild(n); } }, 1200); })(p);
    }
  }

  /* Station environment */
  function setStation(key) {
    if (state.station === key) { return; }
    state.station = key;
    var s = STATIONS[key];
    document.getElementById("sky").setAttribute("color", s.sky);
    ["ring1", "ring2", "ring3"].forEach(function (id) { document.getElementById(id).setAttribute("material", "color", s.color); });
    document.getElementById("glow").setAttribute("light", "color", s.color);
    buildBackdrop(key);
  }

  function buildBackdrop(key) {
    while (bd.firstChild) { bd.removeChild(bd.firstChild); }
    var i;
    if (key === "space") {
      var sun = mk("a-entity", { position: "-9 6 -18", animation: "property: scale; dir: alternate; dur: 3200; easing: easeInOutSine; loop: true; from: 1 1 1; to: 1.06 1.06 1.06" }, bd);
      mk("a-sphere", { radius: 2.2, material: "shader: flat; color: #ffb347" }, sun);
      mk("a-sphere", { radius: 3.1, material: "shader: flat; color: #ffb347; opacity: 0.16; transparent: true" }, sun);
      mk("a-sphere", { radius: 4.2, material: "shader: flat; color: #ff8a3d; opacity: 0.08; transparent: true" }, sun);
      var sat = mk("a-entity", { position: "9 5.5 -17" }, bd);
      var satBody = mk("a-entity", { animation: "property: rotation; to: 0 360 0; dur: 40000; easing: linear; loop: true" }, sat);
      mk("a-sphere", { radius: 1.2, material: "color: #e3c58a; roughness: 0.9; emissive: #e3c58a; emissiveIntensity: 0.15" }, satBody);
      mk("a-torus", { radius: 2.1, "radius-tubular": 0.1, rotation: "72 0 -18", scale: "1 1 0.15", material: "color: #cdb27a; roughness: 0.9; emissive: #cdb27a; emissiveIntensity: 0.2" }, sat);
    } else if (key === "chem") {
      var mol = mk("a-entity", { position: "-9 5 -15", animation: "property: rotation; to: 0 360 0; dur: 20000; easing: linear; loop: true" }, bd);
      mk("a-sphere", { radius: 1, material: "color: #ff5470; roughness: 0.5; emissive: #ff5470; emissiveIntensity: 0.2" }, mol);
      mk("a-sphere", { radius: 0.62, position: "1.25 -0.95 0", material: "color: #f4f6ff; roughness: 0.5; emissive: #f4f6ff; emissiveIntensity: 0.15" }, mol);
      mk("a-sphere", { radius: 0.62, position: "-1.25 -0.95 0", material: "color: #f4f6ff; roughness: 0.5; emissive: #f4f6ff; emissiveIntensity: 0.15" }, mol);
      mk("a-cylinder", { radius: 0.12, height: 1.57, position: "0.625 -0.475 0", rotation: "0 0 -127.2", material: "color: #aab4ff" }, mol);
      mk("a-cylinder", { radius: 0.12, height: 1.57, position: "-0.625 -0.475 0", rotation: "0 0 127.2", material: "color: #aab4ff" }, mol);
      for (i = 0; i < 16; i++) {
        var bx = rand(-14, 14), by = rand(0, 2), bz = rand(-18, -6);
        mk("a-sphere", {
          radius: rand(0.05, 0.14), position: bx + " " + by + " " + bz,
          material: "shader: flat; color: #5ee6c1; opacity: 0.35; transparent: true",
          animation: "property: position; to: " + bx + " " + (by + 9) + " " + bz + "; dur: " + Math.round(rand(6000, 12000)) + "; easing: linear; loop: true"
        }, bd);
      }
    } else {
      var dna = mk("a-entity", { position: "9 4.5 -14", animation: "property: rotation; to: 0 360 0; dur: 16000; easing: linear; loop: true" }, dna_parent());
      for (i = 0; i < 22; i++) {
        var ang = i * 0.55, y = -4 + i * 0.36, cx = Math.cos(ang) * 1.1, cz = Math.sin(ang) * 1.1;
        mk("a-sphere", { radius: 0.16, position: cx + " " + y + " " + cz, material: "color: #ff6b81; emissive: #ff6b81; emissiveIntensity: 0.3" }, dna);
        mk("a-sphere", { radius: 0.16, position: (-cx) + " " + y + " " + (-cz), material: "color: #5ee6c1; emissive: #5ee6c1; emissiveIntensity: 0.3" }, dna);
        if (i % 2 === 0) {
          mk("a-cylinder", { radius: 0.03, height: 2.2, position: "0 " + y + " 0", rotation: "0 " + (-ang * 180 / Math.PI) + " 90", material: "shader: flat; color: #ffffff; opacity: 0.5; transparent: true" }, dna);
        }
      }
    }
  }
  function dna_parent() { return bd; }

  /* Models for the answer objects */
  var MODELS = {
    planet: function (g, p) {
      var C = { mars: "#d4552b", mercury: "#9c9a97", earth: "#2f7fe0", jupiter: "#d9a066", venus: "#e8c075" }[p];
      mk("a-sphere", { radius: 0.5, material: "color: " + C + "; roughness: 0.9; emissive: " + C + "; emissiveIntensity: 0.18" }, g);
      var i;
      if (p === "jupiter") {
        [[0.18, 0.4665], [-0.05, 0.497], [-0.25, 0.433]].forEach(function (b) {
          mk("a-torus", { radius: b[1] + 0.008, "radius-tubular": 0.028, rotation: "90 0 0", position: "0 " + b[0] + " 0", material: "color: #a8693a; roughness: 1" }, g);
        });
      } else if (p === "earth") {
        [["0.26 0.15 0.415", 0.13], ["-0.3 -0.12 0.38", 0.11], ["0.05 -0.3 0.4", 0.09]].forEach(function (b) {
          mk("a-sphere", { radius: b[1], position: b[0], material: "color: #3fae5a; roughness: 1" }, g);
        });
      } else if (p === "mars") {
        mk("a-sphere", { radius: 0.13, position: "0.2 0.2 0.42", material: "color: #a63d1e; roughness: 1" }, g);
        mk("a-sphere", { radius: 0.09, position: "-0.28 -0.18 0.38", material: "color: #a63d1e; roughness: 1" }, g);
      } else if (p === "mercury") {
        mk("a-sphere", { radius: 0.09, position: "-0.25 0.2 0.4", material: "color: #7d7b78; roughness: 1" }, g);
        mk("a-sphere", { radius: 0.07, position: "0.3 -0.15 0.37", material: "color: #7d7b78; roughness: 1" }, g);
      } else if (p === "venus") {
        mk("a-sphere", { radius: 0.16, position: "0.2 0.22 0.4", material: "color: #f3d896; roughness: 1" }, g);
      }
      g.setAttribute("animation", "property: rotation; to: 0 360 0; dur: 14000; easing: linear; loop: true");
    },
    flask: function (g, p) {
      var L = LIQUID[p];
      var m = mk("a-entity", { position: "0 -0.2 0" }, g);
      mk("a-cone", { "radius-bottom": 0.42, "radius-top": 0.12, height: 0.8, material: "color: #cfeaff; opacity: 0.3; transparent: true; roughness: 0.05; metalness: 0.2; side: double; depthWrite: false" }, m);
      mk("a-cylinder", { radius: 0.12, height: 0.35, position: "0 0.575 0", "open-ended": true, material: "color: #cfeaff; opacity: 0.3; transparent: true; roughness: 0.05; side: double; depthWrite: false" }, m);
      mk("a-cone", { "radius-bottom": 0.39, "radius-top": 0.24, height: 0.4, position: "0 -0.2 0", material: "color: " + L + "; emissive: " + L + "; emissiveIntensity: 0.45; roughness: 0.3" }, m);
      for (var i = 0; i < 3; i++) {
        mk("a-sphere", {
          radius: 0.035, position: (i - 1) * 0.1 + " -0.25 0",
          material: "shader: flat; color: #ffffff; opacity: 0.7; transparent: true",
          animation: "property: position; to: " + (i - 1) * 0.1 + " 0.12 0; dur: " + (1300 + i * 400) + "; easing: linear; loop: true"
        }, m);
      }
      g.setAttribute("animation", "property: rotation; from: 0 -20 0; to: 0 20 0; dir: alternate; dur: 3200; easing: easeInOutSine; loop: true");
    },
    heart: function (g) {
      var m = mk("a-entity", { position: "0 0 0", animation: "property: scale; dir: alternate; from: 1 1 1; to: 1.12 1.12 1.12; dur: 420; easing: easeInOutSine; loop: true" }, g);
      var mat = "color: #e0364f; roughness: 0.45; emissive: #e0364f; emissiveIntensity: 0.25";
      mk("a-sphere", { radius: 0.26, position: "-0.17 0.12 0", material: mat }, m);
      mk("a-sphere", { radius: 0.26, position: "0.17 0.12 0", material: mat }, m);
      mk("a-cone", { "radius-bottom": 0.43, "radius-top": 0, height: 0.66, position: "0 -0.2 0", rotation: "0 0 180", material: mat }, m);
      mk("a-cylinder", { radius: 0.07, height: 0.3, position: "0.02 0.42 0", rotation: "0 0 -20", material: "color: #ff8aa0; roughness: 0.5" }, m);
      g.setAttribute("animation", "property: rotation; from: 0 -25 0; to: 0 25 0; dir: alternate; dur: 3600; easing: easeInOutSine; loop: true");
    },
    lungs: function (g) {
      var m = mk("a-entity", { animation: "property: scale; dir: alternate; from: 1 1 1; to: 1.07 1.07 1.07; dur: 1500; easing: easeInOutSine; loop: true" }, g);
      var mat = "color: #f59bb6; roughness: 0.6; emissive: #f59bb6; emissiveIntensity: 0.18";
      mk("a-sphere", { radius: 0.28, scale: "0.8 1.3 0.7", position: "-0.24 -0.05 0", rotation: "0 0 8", material: mat }, m);
      mk("a-sphere", { radius: 0.28, scale: "0.8 1.3 0.7", position: "0.24 -0.05 0", rotation: "0 0 -8", material: mat }, m);
      mk("a-cylinder", { radius: 0.05, height: 0.5, position: "0 0.3 0", material: "color: #ffd0dc; roughness: 0.6" }, m);
      g.setAttribute("animation", "property: rotation; from: 0 -25 0; to: 0 25 0; dir: alternate; dur: 3600; easing: easeInOutSine; loop: true");
    },
    stomach: function (g) {
      var m = mk("a-entity", {}, g);
      mk("a-sphere", { radius: 0.3, scale: "1.25 0.9 0.8", rotation: "0 0 25", material: "color: #e8935a; roughness: 0.55; emissive: #e8935a; emissiveIntensity: 0.18" }, m);
      mk("a-cylinder", { radius: 0.06, height: 0.4, position: "-0.2 0.32 0", rotation: "0 0 -15", material: "color: #f2b389; roughness: 0.6" }, m);
      g.setAttribute("animation", "property: rotation; from: 0 -25 0; to: 0 25 0; dir: alternate; dur: 3600; easing: easeInOutSine; loop: true");
    },
    brain: function (g) {
      var mat = "color: #c79bf2; roughness: 0.6; emissive: #c79bf2; emissiveIntensity: 0.2";
      var bump = "color: #b080e6; roughness: 0.7";
      var m = mk("a-entity", {}, g);
      mk("a-sphere", { radius: 0.3, scale: "1 0.85 1.15", position: "-0.15 0.02 0", material: mat }, m);
      mk("a-sphere", { radius: 0.3, scale: "1 0.85 1.15", position: "0.15 0.02 0", material: mat }, m);
      [["-0.2 0.24 0.12"], ["0.2 0.24 0.12"], ["-0.2 0.24 -0.14"], ["0.2 0.24 -0.14"], ["0 0.28 0"], ["-0.36 0.05 0.1"], ["0.36 0.05 0.1"], ["-0.34 0.04 -0.16"], ["0.34 0.04 -0.16"]].forEach(function (b) {
        mk("a-sphere", { radius: 0.1, position: b[0], material: bump }, m);
      });
      mk("a-sphere", { radius: 0.13, position: "0 -0.2 -0.25", material: "color: #a86fe0; roughness: 0.7" }, m);
      mk("a-cylinder", { radius: 0.06, height: 0.3, position: "0 -0.3 -0.05", material: "color: #d9bdf7; roughness: 0.7" }, m);
      g.setAttribute("animation", "property: rotation; from: 0 -25 0; to: 0 25 0; dir: alternate; dur: 3600; easing: easeInOutSine; loop: true");
    }
  };

  /* Screens */
  function accent() { return STATIONS[state.station].color; }

  function showIntro() {
    clearUI();
    state.i = 0; state.score = 0; state.res = []; state.locked = false;
    setStation("space");
    var c = accent();
    mk("a-entity", { position: "0 3.2 -3.4", ctext: { text: "مختبر الفضاء", w: 5.6, h: 1.3, size: 110, font: "Lalezar", weight: "400", color: c } }, ui);
    mk("a-entity", { position: "0 2.3 -3.4", ctext: { text: "يوم العلوم", w: 4, h: 0.7, size: 60, weight: "800", color: TEXT } }, ui);
    mk("a-entity", { position: "0 1.4 -3.4", ctext: { text: "ست أسئلة في ثلاث محطات: الفضاء والكيمياء وجسم الإنسان.\nاضغط على الإجابة الصحيحة لتجمع النقاط.", w: 5.4, h: 1.2, size: 40, bg: PANEL + "ee", border: c } }, ui);
    button("ابدأ", 0, 0.5, -3.2, 2.4, 0.72, startRound);
  }

  function button(label, x, y, z, w, h, fn) {
    var b = mk("a-entity", { class: "clickable", position: x + " " + y + " " + z, ctext: { text: label, w: w, h: h, size: 52, weight: "800", bg: accent(), color: INK, radius: 60 } }, ui);
    b.addEventListener("mouseenter", function () { b.setAttribute("scale", "1.07 1.07 1.07"); });
    b.addEventListener("mouseleave", function () { b.setAttribute("scale", "1 1 1"); });
    b.addEventListener("click", fn);
    return b;
  }

  var hudEl, qEl, wraps;

  function hudText() {
    return STATIONS[state.station].name + "  •  سؤال " + (state.i + 1) + " من " + QUESTIONS.length + "  •  النقاط " + state.score;
  }

  function startRound() {
    clearUI();
    state.locked = false;
    var q = QUESTIONS[state.i];
    setStation(q.st);
    var c = accent();
    hudEl = mk("a-entity", { position: "0 3.7 -3.4", ctext: { text: hudText(), w: 5.2, h: 0.46, size: 34, weight: "800", color: INK, bg: c, radius: 40 } }, ui);
    qEl = mk("a-entity", { position: "0 2.9 -3.4", ctext: { text: q.q, w: 6.2, h: 1.2, size: 54, weight: "800", bg: PANEL + "ee", border: c } }, ui);
    wraps = [];
    var xs = [-2.0, 0, 2.0];
    shuffle(q.opts).forEach(function (opt, idx) { wraps.push(buildOption(opt, xs[idx], idx, c)); });
  }

  function buildOption(opt, x, idx, c) {
    var wrap = mk("a-entity", { position: x + " 1.5 -3.2" }, ui);
    var fl = mk("a-entity", { animation: "property: position; dir: alternate; dur: " + (1700 + idx * 260) + "; easing: easeInOutSine; loop: true; from: 0 0 0; to: 0 0.12 0" }, wrap);
    var body = mk("a-entity", {}, fl);
    MODELS[opt.k](body, opt.p);
    var hit = mk("a-sphere", { class: "clickable", radius: 0.78, material: "opacity: 0; transparent: true; depthWrite: false" }, wrap);
    var label = mk("a-entity", { class: "clickable", position: "0 -0.68 0", ctext: { text: opt.l, w: 1.9, h: 0.56, size: 48, weight: "800", bg: PANEL + "ee", border: c, radius: 44 } }, wrap);
    var rec = { opt: opt, wrap: wrap, x: x };
    [hit, label].forEach(function (t) {
      t.addEventListener("mouseenter", function () { if (!state.locked) { wrap.setAttribute("scale", "1.1 1.1 1.1"); } });
      t.addEventListener("mouseleave", function () { wrap.setAttribute("scale", "1 1 1"); });
      t.addEventListener("click", function () { onPick(rec); });
    });
    return rec;
  }

  function ring(rec, color) {
    mk("a-torus", { radius: 0.8, "radius-tubular": 0.04, "segments-tubular": 64, material: "shader: flat; color: " + color }, rec.wrap);
  }

  function onPick(rec) {
    if (state.locked) { return; }
    state.locked = true;
    var q = QUESTIONS[state.i];
    var good = !!rec.opt.ok;
    var correct = wraps.filter(function (w) { return w.opt.ok; })[0];
    wraps.forEach(function (w) { w.wrap.setAttribute("scale", "1 1 1"); });
    ring(correct, GOOD);
    if (!good) { ring(rec, BAD); }
    state.res.push(good);
    if (good) { state.score += 10; beep([660, 880, 1100]); burst(correct.x, 1.5, -3.2, GOOD); }
    else { beep([240, 180]); }
    hudEl.setAttribute("ctext", { text: hudText() });
    qEl.setAttribute("ctext", {
      title: good ? "إجابة صحيحة! +10 نقاط" : "ليست هذه الإجابة",
      titleColor: good ? GOOD : BAD,
      text: (good ? "" : "الإجابة الصحيحة: " + correct.opt.l + "\n") + q.fact,
      size: 40,
      border: good ? GOOD : BAD
    });
    var last = state.i === QUESTIONS.length - 1;
    button(last ? "عرض النتيجة" : "السؤال التالي", 0, 0.28, -2.9, 2.6, 0.62, function () {
      if (last) { showResult(); } else { state.i += 1; startRound(); }
    });
  }

  function showResult() {
    clearUI();
    var c = accent();
    var total = QUESTIONS.length * 10;
    var s = state.score, rating;
    if (s === total) { rating = "عالِم حقيقي! أجبت عن كل الأسئلة بشكل صحيح."; }
    else if (s >= 40) { rating = "مستكشف ممتاز! أداء رائع."; }
    else if (s >= 20) { rating = "بداية جيدة. جرّب مرة ثانية لتكتشف أكثر."; }
    else { rating = "لا بأس، فالمحاولة تصنع العلماء."; }
    mk("a-entity", { position: "0 3.3 -3.4", ctext: { text: "انتهت التجربة", w: 5.6, h: 1.2, size: 100, font: "Lalezar", weight: "400", color: c } }, ui);
    mk("a-entity", { position: "0 2.45 -3.4", ctext: { text: "النقاط: " + s + " من " + total, w: 4.6, h: 0.8, size: 62, weight: "800", color: TEXT } }, ui);
    mk("a-entity", { position: "0 1.65 -3.4", ctext: { text: rating + "\nشكرًا لمشاركتك في يوم العلوم", w: 5.6, h: 1.2, size: 42, bg: PANEL + "ee", border: c } }, ui);
    state.res.forEach(function (ok, i) {
      var x = (i - (state.res.length - 1) / 2) * 0.5;
      mk("a-sphere", { radius: 0.13, position: x + " 0.95 -3.2", material: "shader: flat; color: " + (ok ? GOOD : BAD) }, ui);
    });
    button("العب من جديد", 0, 0.4, -3.0, 2.8, 0.7, function () { showIntro(); });
    if (s === total) { burst(0, 1.65, -3.2, c); }
    beep(s >= 40 ? [523, 659, 784, 1046] : [392, 330]);
  }

  /* Gaze fallback for headsets without controllers (cardboard-style viewers) */
  var gaze = document.getElementById("gaze");
  var haveCtrl = false;
  function setGaze(on) {
    gaze.setAttribute("visible", on);
    gaze.setAttribute("raycaster", "enabled", on);
  }
  ["lhand", "rhand"].forEach(function (id) {
    document.getElementById(id).addEventListener("controllerconnected", function () { haveCtrl = true; setGaze(false); });
  });
  scene.addEventListener("enter-vr", function () {
    haveCtrl = false;
    setTimeout(function () { if (!haveCtrl && scene.is("vr-mode")) { setGaze(true); } }, 1500);
  });
  scene.addEventListener("exit-vr", function () { setGaze(false); });

  /* Hint line */
  window.addEventListener("pointerdown", function () {
    var h = document.getElementById("hint");
    if (h) { h.classList.add("gone"); }
  }, { once: true });

  /* Fonts: redraw all canvas text once the Arabic faces are ready */
  function redraw() {
    var els = document.querySelectorAll("[ctext]");
    for (var i = 0; i < els.length; i++) {
      var c = els[i].components && els[i].components.ctext;
      if (c && c.draw) { c.draw(); }
    }
  }
  if (document.fonts && document.fonts.load) {
    Promise.all([
      document.fonts.load("600 40px Cairo", "مختبر"),
      document.fonts.load("800 40px Cairo", "مختبر"),
      document.fonts.load("40px Lalezar", "مختبر")
    ]).then(redraw).catch(function () {});
    document.fonts.ready.then(redraw);
  }

  function boot() { showIntro(); }
  if (scene.hasLoaded) { boot(); } else { scene.addEventListener("loaded", boot); }
})();
</script>

</html>

<style>
/* Layout: a full-bleed WebXR scene. A menu of six icon tiles leads to three quiz stations, a timed quiz, a rocket race and a science XO board. Each mode has its own accent. In 2D mode a single hint line floats at the bottom. */
:root {
  --ink: #070a1f;
  --panel: #101743;
  --text: #eef1ff;
  --space: #ffb347;
  --chem: #5ee6c1;
  --body: #ff6b81;
  --race: #b794ff;
  --rocket: #ff8f5a;
  --xo: #4cc9f0;
  --good: #4ade80;
  --bad: #ff7a8a;
  --font-display: 'Lalezar', 'Cairo', Tahoma, sans-serif;
  --font-body: 'Cairo', Tahoma, sans-serif;
  color-scheme: dark;
}
html, body { background: var(--ink); color: var(--text); font-family: var(--font-body); }
#hint {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 5;
  direction: rtl;
  text-align: center;
  font-size: 14px;
  line-height: 1.6;
  color: var(--text);
  padding-top: 10px;
  padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: linear-gradient(to top, rgba(7, 10, 31, 0.85), rgba(7, 10, 31, 0));
  pointer-events: none;
  transition: opacity 0.6s ease;
}
#hint.gone { opacity: 0; }
#status {
  position: fixed;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  z-index: 6;
  direction: rtl;
  width: min(86vw, 420px);
  text-align: center;
  font-size: 16px;
  line-height: 1.7;
  color: var(--text);
  background: var(--panel);
  border: 2px solid var(--space);
  border-radius: 18px;
  padding: 16px 20px;
}
</style>

<script>
/* Diagnostics: show load problems on screen instead of a blank page. */
(function () {
  var s = function () { return document.getElementById("status"); };
  function show(msg) { var el = s(); if (el) { el.hidden = false; el.textContent = msg; } }
  try {
    var c = document.createElement("canvas");
    if (!(c.getContext("webgl2") || c.getContext("webgl"))) {
      show("هذا المتصفح لا يدعم الرسوم ثلاثية الأبعاد (WebGL). جرّبي Chrome أو Safari أو جهاز آخر.");
    }
  } catch (e) { /* ignore */ }
  window.addEventListener("error", function (e) {
    if (e.target && e.target !== window) { return; }
    show("حدث خطأ: " + (e.message || "غير معروف"));
  });
  window.addEventListener("load", function () {
    if (!window.AFRAME) { show("تعذّر تحميل مكتبة A-Frame من الإنترنت (جُرّبت ثلاثة مصادر). جرّبي شبكة أو متصفحاً آخر."); }
  });
  setTimeout(function () {
    if (!window.__booted) {
      show(window.AFRAME ? "التحميل متوقف أو بطيء. حدّثي الصفحة أو جرّبي متصفحاً آخر." : "تعذّر تحميل مكتبة A-Frame من الإنترنت. جرّبي شبكة أو متصفحاً آخر.");
    }
  }, 12000);
})();
</script>

<script>
/* Components: canvas text that supports Arabic shaping, a star field, and a per-frame loop hook. */
(function () {
  if (!window.AFRAME) { return; }
  var THREE = AFRAME.THREE;

  function roundRect(ctx, x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function wrap(ctx, text, maxW) {
    var out = [];
    String(text).split("\n").forEach(function (para) {
      if (para === "") { out.push(""); return; }
      var words = para.split(" "), line = "";
      words.forEach(function (w) {
        var t = line ? line + " " + w : w;
        if (ctx.measureText(t).width > maxW && line) { out.push(line); line = w; }
        else { line = t; }
      });
      out.push(line);
    });
    return out;
  }

  function stack(f) { return "'" + f + "', Cairo, Tahoma, sans-serif"; }

  AFRAME.registerComponent("ctext", {
    schema: {
      text: { default: "" },
      title: { default: "" },
      titleColor: { default: "#ffb347" },
      titleFont: { default: "Lalezar" },
      w: { default: 2 },
      h: { default: 0.5 },
      size: { default: 48 },
      color: { default: "#eef1ff" },
      bg: { default: "" },
      border: { default: "" },
      radius: { default: 40 },
      font: { default: "Cairo" },
      weight: { default: "600" },
      ppu: { default: 360 },
      lh: { default: 1.4 }
    },
    init: function () {
      this.canvas = document.createElement("canvas");
      this.ctx = this.canvas.getContext("2d");
      this.tex = new THREE.CanvasTexture(this.canvas);
      if (THREE.SRGBColorSpace) { this.tex.colorSpace = THREE.SRGBColorSpace; }
      this.tex.anisotropy = 8;
      this.mesh = new THREE.Mesh(
        new THREE.PlaneGeometry(1, 1),
        new THREE.MeshBasicMaterial({ map: this.tex, transparent: true, depthWrite: false, toneMapped: false })
      );
      this.el.setObject3D("mesh", this.mesh);
    },
    update: function () {
      var d = this.data;
      var w = Math.max(8, Math.round(d.w * d.ppu));
      var h = Math.max(8, Math.round(d.h * d.ppu));
      if (this.canvas.width !== w || this.canvas.height !== h) {
        this.canvas.width = w;
        this.canvas.height = h;
        this.tex.dispose();
      }
      this.mesh.scale.set(d.w, d.h, 1);
      this.draw();
    },
    draw: function () {
      var d = this.data, c = this.canvas, ctx = this.ctx, W = c.width, H = c.height;
      ctx.clearRect(0, 0, W, H);
      if (d.bg) { ctx.fillStyle = d.bg; roundRect(ctx, 0, 0, W, H, d.radius); ctx.fill(); }
      if (d.border) { ctx.lineWidth = 7; ctx.strokeStyle = d.border; roundRect(ctx, 4, 4, W - 8, H - 8, d.radius); ctx.stroke(); }
      ctx.direction = "rtl";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      var padX = d.size * 0.9, maxW = W - padX * 2, items = [];
      var tsz = Math.round(d.size * 1.3), tf = tsz + "px " + stack(d.titleFont);
      var bf = d.weight + " " + d.size + "px " + stack(d.font);
      if (d.title) {
        ctx.font = tf;
        wrap(ctx, d.title, maxW).forEach(function (l) { items.push({ t: l, f: tf, c: d.titleColor, h: tsz * d.lh }); });
      }
      if (d.text) {
        ctx.font = bf;
        wrap(ctx, d.text, maxW).forEach(function (l) { items.push({ t: l, f: bf, c: d.color, h: d.size * d.lh }); });
      }
      var total = 0;
      items.forEach(function (it) { total += it.h; });
      var y = (H - total) / 2;
      items.forEach(function (it) {
        ctx.font = it.f;
        ctx.fillStyle = it.c;
        ctx.fillText(it.t, W / 2, y + it.h / 2);
        y += it.h;
      });
      this.tex.needsUpdate = true;
    },
    remove: function () {
      this.el.removeObject3D("mesh");
      this.tex.dispose();
      this.mesh.geometry.dispose();
      this.mesh.material.dispose();
    }
  });

  AFRAME.registerComponent("starfield", {
    schema: { count: { default: 1100 }, radius: { default: 70 } },
    init: function () {
      var n = this.data.count, pos = new Float32Array(n * 3), col = new Float32Array(n * 3);
      for (var i = 0; i < n; i++) {
        var u = Math.random() * 2 - 1, th = Math.random() * Math.PI * 2;
        var r = this.data.radius * (0.7 + Math.random() * 0.3), s = Math.sqrt(1 - u * u);
        pos[i * 3] = r * s * Math.cos(th);
        pos[i * 3 + 1] = Math.abs(u) * r * 0.95 + 2;
        pos[i * 3 + 2] = r * s * Math.sin(th);
        var b = 0.5 + Math.random() * 0.5, warm = Math.random() < 0.25;
        col[i * 3] = warm ? b : b * 0.8;
        col[i * 3 + 1] = warm ? b * 0.85 : b * 0.9;
        col[i * 3 + 2] = warm ? b * 0.6 : b;
      }
      var g = new THREE.BufferGeometry();
      g.setAttribute("position", new THREE.BufferAttribute(pos, 3));
      g.setAttribute("color", new THREE.BufferAttribute(col, 3));
      var m = new THREE.PointsMaterial({ size: 0.45, vertexColors: true, sizeAttenuation: true, fog: false, transparent: true, opacity: 0.95 });
      this.el.setObject3D("stars", new THREE.Points(g, m));
    }
  });

  AFRAME.registerComponent("looper", {
    tick: function (t, dt) { if (window.__tick) { window.__tick(t, dt); } }
  });
})();
</script>

<script>
/* Game logic: intro, menu, quiz stations, timed quiz, rocket race (arm swing), science XO (hand touch), result. */
(function () {
  if (!window.AFRAME) { return; }
  var scene = document.getElementById("scene");
  var ui = document.getElementById("ui");
  var bd = document.getElementById("backdrop");
  var css = getComputedStyle(document.documentElement);
  function tok(n) { return css.getPropertyValue(n).trim(); }

  var INK = tok("--ink"), PANEL = tok("--panel"), TEXT = tok("--text"), GOOD = tok("--good"), BAD = tok("--bad");
  var RACE = tok("--race"), ROCKET = tok("--rocket"), XOC = tok("--xo");
  var STATIONS = {
    space: { name: "محطة الفضاء", color: tok("--space"), sky: "#0a0f33" },
    chem: { name: "محطة الكيمياء", color: tok("--chem"), sky: "#061f2a" },
    body: { name: "محطة جسم الإنسان", color: tok("--body"), sky: "#2a0c24" }
  };
  var LIQUID = { teal: "#36e0b5", violet: "#a77bff", amber: "#ffb347" };
  var RACE_SECONDS = 60;

  var QUESTIONS = [
    { st: "space", q: "أي كوكب يُعرف باسم الكوكب الأحمر؟",
      opts: [{ k: "planet", p: "mars", l: "المريخ", ok: 1 }, { k: "planet", p: "mercury", l: "عطارد" }, { k: "planet", p: "earth", l: "الأرض" }],
      fact: "يبدو المريخ أحمر لأن تربته غنية بأكسيد الحديد، أي الصدأ." },
    { st: "space", q: "ما أكبر كوكب في المجموعة الشمسية؟",
      opts: [{ k: "planet", p: "jupiter", l: "المشتري", ok: 1 }, { k: "planet", p: "venus", l: "الزهرة" }, { k: "planet", p: "earth", l: "الأرض" }],
      fact: "كتلة المشتري أكبر من كتلة جميع الكواكب الأخرى مجتمعة." },
    { st: "space", q: "أي كوكب هو الأقرب إلى الشمس؟",
      opts: [{ k: "planet", p: "mercury", l: "عطارد", ok: 1 }, { k: "planet", p: "venus", l: "الزهرة" }, { k: "planet", p: "mars", l: "المريخ" }],
      fact: "عطارد أقرب كواكب المجموعة الشمسية إلى الشمس، وهو أيضاً أصغرها." },
    { st: "space", q: "أي كوكب يُلقّب بتوأم الأرض لأن حجمه قريب من حجمها؟",
      opts: [{ k: "planet", p: "venus", l: "الزهرة", ok: 1 }, { k: "planet", p: "mercury", l: "عطارد" }, { k: "planet", p: "mars", l: "المريخ" }],
      fact: "الزهرة أسخن كواكب المجموعة الشمسية بسبب غلافها الجوي الكثيف." },
    { st: "chem", q: "يتكوّن الماء من ذرتي هيدروجين وذرة من أي عنصر؟",
      opts: [{ k: "flask", p: "teal", l: "الأكسجين", ok: 1 }, { k: "flask", p: "violet", l: "الكربون" }, { k: "flask", p: "amber", l: "النيتروجين" }],
      fact: "لهذا تُكتب صيغة الماء H2O، وهو الجزيء الذي يدور خلفك." },
    { st: "chem", q: "عند أي درجة حرارة يغلي الماء النقي عند مستوى سطح البحر؟",
      opts: [{ k: "flask", p: "amber", l: "50 درجة سلسيوس" }, { k: "flask", p: "teal", l: "100 درجة سلسيوس", ok: 1 }, { k: "flask", p: "violet", l: "150 درجة سلسيوس" }],
      fact: "في قمم الجبال يغلي الماء عند درجة أقل لأن الضغط الجوي أقل." },
    { st: "chem", q: "ما الرمز الكيميائي للذهب؟",
      opts: [{ k: "flask", p: "amber", l: "Au", ok: 1 }, { k: "flask", p: "violet", l: "Ag" }, { k: "flask", p: "teal", l: "Fe" }],
      fact: "الرمز Au مأخوذ من الاسم اللاتيني للذهب." },
    { st: "chem", q: "ما العنصر الأخف في الكون؟",
      opts: [{ k: "flask", p: "violet", l: "الهيليوم" }, { k: "flask", p: "teal", l: "الهيدروجين", ok: 1 }, { k: "flask", p: "amber", l: "الأكسجين" }],
      fact: "الهيدروجين أخف العناصر في الجدول الدوري، وهو أكثرها وفرة في الكون." },
    { st: "body", q: "أي عضو يضخ الدم إلى جميع أنحاء الجسم؟",
      opts: [{ k: "heart", l: "القلب", ok: 1 }, { k: "lungs", l: "الرئتان" }, { k: "stomach", l: "المعدة" }],
      fact: "يخفق قلب الإنسان نحو 100 ألف مرة في اليوم الواحد." },
    { st: "body", q: "أي عضو يتحكم في التفكير والذاكرة والحركة؟",
      opts: [{ k: "stomach", l: "المعدة" }, { k: "brain", l: "الدماغ", ok: 1 }, { k: "lungs", l: "الرئتان" }],
      fact: "الدماغ جزء صغير من وزن الجسم، لكنه يستهلك نحو خُمس طاقته." },
    { st: "body", q: "أي عضو يفرز أحماضاً تساعد على هضم الطعام؟",
      opts: [{ k: "heart", l: "القلب" }, { k: "stomach", l: "المعدة", ok: 1 }, { k: "brain", l: "الدماغ" }],
      fact: "حمض المعدة قوي بما يكفي لتفتيت الطعام، وطبقة مخاطية تحمي جدار المعدة منه." },
    { st: "body", q: "أي عضو ينقل الأكسجين من الهواء إلى الدم؟",
      opts: [{ k: "lungs", l: "الرئتان", ok: 1 }, { k: "heart", l: "القلب" }, { k: "stomach", l: "المعدة" }],
      fact: "تحتوي الرئتان على ملايين الأكياس الهوائية الصغيرة التي يعبر منها الأكسجين إلى الدم." }
  ];

  var state = { mode: null, list: [], i: 0, score: 0, res: [], locked: false, station: null, round: 0, timer: null, left: 0 };
  var pokes = [], lastPoke = 0;
  var haveCtrl = false;

  function mk(tag, attrs, parent) {
    var e = document.createElement(tag);
    for (var k in attrs) { e.setAttribute(k, attrs[k]); }
    (parent || scene).appendChild(e);
    return e;
  }
  function clearUI() { pokes = []; while (ui.firstChild) { ui.removeChild(ui.firstChild); } }
  function rand(a, b) { return a + Math.random() * (b - a); }
  function shuffle(a) {
    var r = a.slice();
    for (var i = r.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = r[i]; r[i] = r[j]; r[j] = t; }
    return r;
  }
  function stopTimer() { if (state.timer) { clearInterval(state.timer); state.timer = null; } }
  function inVR() { return haveCtrl && typeof scene.is === "function" && scene.is("vr-mode"); }
  function addPoke(el, r, fn, tag) { pokes.push({ el: el, r: r, fn: fn, tag: tag || "", armed: true }); }
  function removePokes(tag) { pokes = pokes.filter(function (p) { return p.tag !== tag; }); }

  /* Sound */
  var ac;
  function beep(freqs) {
    try {
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      var t = ac.currentTime, dur = 0.12;
      freqs.forEach(function (f, i) {
        var o = ac.createOscillator(), g = ac.createGain();
        o.type = "sine"; o.frequency.value = f;
        g.gain.setValueAtTime(0.0001, t + i * dur);
        g.gain.exponentialRampToValueAtTime(0.18, t + i * dur + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, t + i * dur + dur);
        o.connect(g); g.connect(ac.destination);
        o.start(t + i * dur); o.stop(t + i * dur + dur + 0.02);
      });
    } catch (e) { /* audio is optional */ }
  }

  function burst(x, y, z, color) {
    for (var i = 0; i < 18; i++) {
      var a = Math.random() * Math.PI * 2, r = 0.6 + Math.random() * 0.9, dy = (Math.random() - 0.2) * 1.2;
      var p = mk("a-sphere", { radius: 0.045, position: x + " " + y + " " + z, material: "shader: flat; color: " + (i % 2 ? color : "#ffffff") }, ui);
      p.setAttribute("animation__m", "property: position; to: " + (x + Math.cos(a) * r) + " " + (y + dy) + " " + (z + Math.sin(a) * r * 0.5) + "; dur: 900; easing: easeOutCubic");
      p.setAttribute("animation__s", "property: scale; to: 0 0 0; dur: 900; delay: 200; easing: easeInQuad");
      (function (n) { setTimeout(function () { if (n.parentNode) { n.parentNode.removeChild(n); } }, 1200); })(p);
    }
  }

  /* Station environment */
  function setStation(key) {
    if (state.station === key) { return; }
    state.station = key;
    var s = STATIONS[key];
    document.getElementById("sky").setAttribute("color", s.sky);
    ["ring1", "ring2", "ring3"].forEach(function (id) { document.getElementById(id).setAttribute("material", "color", s.color); });
    document.getElementById("glow").setAttribute("light", "color", s.color);
    buildBackdrop(key);
  }

  function buildBackdrop(key) {
    while (bd.firstChild) { bd.removeChild(bd.firstChild); }

    }

    qEl.setAttribute("ctext", {
      title: good ? "إجابة صحيحة! +10 نقاط" : "ليست هذه الإجابة",
      titleColor: good ? GOOD : BAD,
      text: (good ? "" : "الإجابة الصحيحة: " + correct.opt.l + "\n") + q.fact,
      size: 40,
      border: good ? GOOD : BAD
    });
    var last = state.i === state.list.length - 1;
    button(last ? "عرض النتيجة" : "السؤال التالي", 0, 0.28, -2.9, 2.6, 0.62, function () {
      if (last) { showResult(); } else { state.i += 1; startRound(); }
    });
  }

  function showResult() {
    stopTimer(); clearUI();
    state.round += 1;
    var c = accent();
    var race = state.mode === "race";
    var s = state.score;
    var right = state.res.filter(function (r) { return r; }).length;
    var rating, scoreLine;
    if (race) {
      scoreLine = "النقاط: " + s;
      if (right >= 8) { rating = "سريع كالبرق! أجبت عن " + right + " أسئلة بشكل صحيح."; }
      else if (right >= 5) { rating = "أداء ممتاز! أجبت عن " + right + " أسئلة بشكل صحيح."; }
      else if (right >= 2) { rating = "بداية جيدة: " + right + " إجابات صحيحة. جرّب مرة ثانية."; }
      else { rating = "لا بأس، التحدي يحتاج تدريباً. جرّب مرة ثانية."; }
    } else {
      var total = state.list.length * 10;
      var pct = total ? s / total : 0;
      scoreLine = "النقاط: " + s + " من " + total;
      if (pct === 1) { rating = "عالِم حقيقي! أجبت عن كل الأسئلة بشكل صحيح."; }
      else if (pct >= 0.65) { rating = "مستكشف ممتاز! أداء رائع."; }
      else if (pct >= 0.3) { rating = "بداية جيدة. جرّب مرة ثانية لتكتشف أكثر."; }
      else { rating = "لا بأس، فالمحاولة تصنع العلماء."; }
    }
    mk("a-entity", { position: "0 3.3 -3.4", ctext: { text: race ? "انتهى التحدي" : "انتهت التجربة", w: 5.6, h: 1.2, size: 100, font: "Lalezar", weight: "400", color: c } }, ui);
    mk("a-entity", { position: "0 2.45 -3.4", ctext: { text: scoreLine, w: 4.6, h: 0.8, size: 62, weight: "800", color: TEXT } }, ui);
    mk("a-entity", { position: "0 1.65 -3.4", ctext: { text: rating + "\nشكرًا لمشاركتك في يوم العلوم", w: 5.6, h: 1.2, size: 42, bg: PANEL + "ee", border: c } }, ui);
    state.res.forEach(function (ok, i) {
      var x = (i - (state.res.length - 1) / 2) * 0.32;
      mk("a-sphere", { radius: 0.1, position: x + " 0.95 -3.2", material: "shader: flat; color: " + (ok ? GOOD : BAD) }, ui);
    });
    var mode = state.mode;
    button("العب من جديد", -1.5, 0.4, -3.0, 2.6, 0.7, function () { startMode(mode); });
    button("القائمة", 1.5, 0.4, -3.0, 2.6, 0.7, showMenu);
    var perfect = race ? right >= 8 : (state.list.length > 0 && s === state.list.length * 10);
    if (perfect) { burst(0, 1.65, -3.2, c); }
    beep(right >= Math.ceil(state.res.length * 0.65) ? [523, 659, 784, 1046] : [392, 330]);
  }

  /* ---------- Rocket race: swing both arms (VR) or tap fast (screen) ---------- */
  var TRACK = 6.0, START_X = -3.0, STROKE_STEP = 0.2, TAP_STEP = 0.12;
  var race = { phase: "idle", p: 0, a: 0, speed: 0.5, spT: 0, hands: [{ ext: null, dir: 0 }, { ext: null, dir: 0 }], lastTap: 0, pr: null, ar: null, statusEl: null };

  function stroke(h, y) {
    if (h.ext === null) { h.ext = y; return false; }
    if (h.dir >= 0) {
      if (y > h.ext) { h.ext = y; }
      else if (h.ext - y > 0.18) { h.dir = -1; h.ext = y; return true; }
    } else {
      if (y < h.ext) { h.ext = y; }
      else if (y - h.ext > 0.18) { h.dir = 1; h.ext = y; return true; }
    }
    return false;
  }

  function setRaceStatus(text) { if (race.statusEl && race.statusEl.parentNode) { race.statusEl.setAttribute("ctext", { text: text }); } }

  function showRocket() {
    stopTimer(); clearUI();
    state.round += 1; state.mode = "rocket";
    setStation("space");
    var c = accent(), token = state.round;
    race.phase = "count"; race.p = 0; race.a = 0; race.speed = 0.5; race.spT = 0; race.lastTap = 0;
    race.hands[0].ext = null; race.hands[0].dir = 0; race.hands[1].ext = null; race.hands[1].dir = 0;
    [1.12, 1.87, 2.62].forEach(function (y) {
      mk("a-box", { width: 6.8, height: 0.02, depth: 0.02, position: "0 " + y + " -3.6", material: "shader: flat; color: " + c + "; opacity: 0.55; transparent: true" }, ui);
    });
    mk("a-box", { width: 0.08, height: 1.7, depth: 0.08, position: "3.3 1.87 -3.6", material: "shader: flat; color: #ffffff" }, ui);
    mk("a-entity", { position: "3.3 2.95 -3.6", ctext: { text: "خط النهاية", w: 1.5, h: 0.4, size: 34, weight: "800", bg: c, color: INK, radius: 30 } }, ui);
    mk("a-entity", { position: "-3.6 1.5 -3.6", ctext: { text: "أنت", w: 0.8, h: 0.36, size: 34, weight: "800", bg: PANEL + "ee", border: c, radius: 30 } }, ui);
    mk("a-entity", { position: "-3.6 2.25 -3.6", ctext: { text: "الخصم", w: 0.8, h: 0.36, size: 34, weight: "800", bg: PANEL + "ee", border: BAD, radius: 30 } }, ui);
    race.pr = mk("a-entity", { position: START_X + " 1.5 -3.6", rotation: "0 0 -90" }, ui);
    MODELS.rocket(race.pr, c);
    race.ar = mk("a-entity", { position: START_X + " 2.25 -3.6", rotation: "0 0 -90" }, ui);
    MODELS.rocket(race.ar, "#ff6b81");
    race.statusEl = mk("a-entity", { position: "0 3.5 -3.4", ctext: { text: "استعد…", w: 4.4, h: 0.8, size: 60, weight: "800", color: TEXT, bg: PANEL + "ee", border: c } }, ui);
    mk("a-entity", { position: "0 0.55 -3.2", ctext: { text: "حرّك ذراعيك للأعلى والأسفل بسرعة (أو انقر بسرعة) لتسبق الخصم", w: 5.4, h: 0.5, size: 34, weight: "600", color: TEXT } }, ui);
    button("القائمة", -2.6, 0.28, -2.9, 1.5, 0.52, showMenu, 42);
    ["3", "2", "1", "انطلق!"].forEach(function (s, i) {
      setTimeout(function () {
        if (state.round !== token || state.mode !== "rocket") { return; }
        setRaceStatus(s);
        beep(i < 3 ? [440] : [880, 1100]);
        if (i === 3) { race.phase = "go"; }
      }, 900 + i * 900);
    });
  }

  function finishRace(win) {
    race.phase = "done";
    setRaceStatus(win ? "فزت بالسباق! أحسنت." : "فاز الخصم هذه المرة.");
    beep(win ? [523, 659, 784, 1046] : [392, 330]);
    if (win) { burst(START_X + TRACK, 1.5, -3.6, accent()); }
    button("سباق جديد", -1.5, 0.9, -3.0, 2.6, 0.7, showRocket);
    button("القائمة", 1.5, 0.9, -3.0, 2.6, 0.7, showMenu);
  }

  function raceTick(dt) {
    if (race.phase !== "go") { return; }
    race.spT += dt;
    if (race.spT > 1000) { race.spT = 0; race.speed = 0.42 + Math.random() * 0.16; }
    race.a += race.speed * dt / 1000;
    if (race.pr) { race.pr.object3D.position.x = START_X + Math.min(race.p, TRACK); }
    if (race.ar) { race.ar.object3D.position.x = START_X + Math.min(race.a, TRACK); }
    if (race.p >= TRACK) { finishRace(true); }
    else if (race.a >= TRACK) { finishRace(false); }
  }

  function tap() {
    if (race.phase !== "go" || inVR()) { return; }
    var n = performance.now();
    if (n - race.lastTap > 110) { race.lastTap = n; race.p += TAP_STEP; }
  }
  window.addEventListener("pointerdown", tap);
  window.addEventListener("keydown", function (e) { if (e.code === "Space") { if (race.phase === "go") { e.preventDefault(); } tap(); } });

  /* ---------- Science XO: touch a square with your hand, answer to claim it ---------- */
  var LINES = [[0, 1, 2], [3, 4, 5], [6, 7, 8], [0, 3, 6], [1, 4, 7], [2, 5, 8], [0, 4, 8], [2, 4, 6]];
  var xo = { board: [], pool: [], busy: false, over: false, answered: false, cell: -1, boardEl: null, ansEl: null, statusEl: null, cells: [] };

  function xoWinner(b) {
    for (var i = 0; i < LINES.length; i++) {
      var l = LINES[i];
      if (b[l[0]] && b[l[0]] === b[l[1]] && b[l[0]] === b[l[2]]) { return b[l[0]]; }
    }
    return b.indexOf("") === -1 ? "draw" : null;
  }
  function xoStatus(text) { if (xo.statusEl && xo.statusEl.parentNode) { xo.statusEl.setAttribute("ctext", { text: text }); } }

  function showXO() {
    stopTimer(); clearUI();
    state.round += 1; state.mode = "xo"; race.phase = "idle";
    setStation("chem");
    var c = accent();
    xo.board = ["", "", "", "", "", "", "", "", ""];
    xo.pool = shuffle(QUESTIONS); xo.busy = false; xo.over = false; xo.answered = false; xo.cells = []; xo.ansEl = null;
    xo.statusEl = mk("a-entity", { position: "0 2.25 -1.4", ctext: { text: "دورك: المس مربعاً أو اضغط عليه، ثم أجب عن السؤال.", w: 3.2, h: 0.7, size: 38, weight: "800", bg: PANEL + "ee", border: c, radius: 36 } }, ui);
    xo.boardEl = mk("a-entity", { position: "0 1.15 -0.85", rotation: "-55 0 0" }, ui);
    mk("a-plane", { width: 0.98, height: 0.98, position: "0 0 -0.01", material: "color: #0d1440; opacity: 0.92; transparent: true; roughness: 1" }, xo.boardEl);
    [-0.16, 0.16].forEach(function (v) {
      mk("a-box", { width: 0.012, height: 0.94, depth: 0.01, position: v + " 0 0", material: "shader: flat; color: " + c }, xo.boardEl);
      mk("a-box", { width: 0.94, height: 0.012, depth: 0.01, position: "0 " + v + " 0", material: "shader: flat; color: " + c }, xo.boardEl);
    });
    for (var i = 0; i < 9; i++) {
      (function (i) {
        var cx = ((i % 3) - 1) * 0.32, cy = (1 - Math.floor(i / 3)) * 0.32;
        var cell = mk("a-plane", { class: "clickable", width: 0.28, height: 0.28, position: cx + " " + cy + " 0.005", material: "color: #1a2360; opacity: 0.45; transparent: true" }, xo.boardEl);
        xo.cells.push(cell);
        cell.addEventListener("click", function () { xoPick(i); });
        cell.addEventListener("mouseenter", function () { if (!xo.busy && !xo.over && !xo.board[i]) { cell.setAttribute("material", "opacity", 0.85); } });
        cell.addEventListener("mouseleave", function () { cell.setAttribute("material", "opacity", 0.45); });
        addPoke(cell, 0.1, function () { xoPick(i); }, "cell");
      })(i);
    }
    button("القائمة", -0.95, 1.25, -0.9, 0.75, 0.26, showMenu, 36, 0.1);
    button("من جديد", 0.95, 1.25, -0.9, 0.75, 0.26, showXO, 36, 0.1);
  }

  function xoRepoke() {
    removePokes("cell");
    xo.cells.forEach(function (cell, i) { if (!xo.board[i]) { addPoke(cell, 0.1, function () { xoPick(i); }, "cell"); } });
  }

  function xoPick(i) {
    if (state.mode !== "xo" || xo.busy || xo.over || xo.board[i]) { return; }
    xo.busy = true; xo.answered = false; xo.cell = i;
    xo.boardEl.setAttribute("visible", false);
    removePokes("cell");
    if (!xo.pool.length) { xo.pool = shuffle(QUESTIONS); }
    var q = xo.pool.pop();
    xoStatus(q.q);
    var c = accent();
    var correctLabel = q.opts.filter(function (o) { return o.ok; })[0].l;
    xo.ansEl = mk("a-entity", { position: "0 1.15 -0.85", rotation: "-55 0 0" }, ui);
    shuffle(q.opts).forEach(function (opt, idx) {
      var x = (idx - 1) * 0.6;
      var orb = mk("a-sphere", { class: "clickable", radius: 0.1, position: x + " 0 0.08", material: "color: " + c + "; emissive: " + c + "; emissiveIntensity: 0.35; roughness: 0.3" }, xo.ansEl);
      var lab = mk("a-entity", { class: "clickable", position: x + " 0.26 0.06", ctext: { text: opt.l, w: 0.56, h: 0.44, size: 28, weight: "800", bg: PANEL + "ee", border: c, radius: 30 } }, xo.ansEl);
      var go = function () { xoAnswer(!!opt.ok, correctLabel); };
      orb.addEventListener("click", go);
      lab.addEventListener("click", go);
      addPoke(orb, 0.12, go, "ans");
    });
  }

  function xoMark(i, m) {
    xo.board[i] = m;
    var cx = ((i % 3) - 1) * 0.32, cy = (1 - Math.floor(i / 3)) * 0.32;
    if (m === "X") {
      var xm = "shader: flat; color: " + XOC;
      mk("a-box", { width: 0.22, height: 0.04, depth: 0.03, position: cx + " " + cy + " 0.03", rotation: "0 0 45", material: xm }, xo.boardEl);
      mk("a-box", { width: 0.22, height: 0.04, depth: 0.03, position: cx + " " + cy + " 0.03", rotation: "0 0 -45", material: xm }, xo.boardEl);
    } else {
      mk("a-torus", { radius: 0.085, "radius-tubular": 0.022, position: cx + " " + cy + " 0.03", material: "shader: flat; color: #ff6b81" }, xo.boardEl);
    }
  }

  function xoAi() {
    var b = xo.board, empty = [];
    b.forEach(function (v, i) { if (!v) { empty.push(i); } });
    function find(m) {
      for (var l = 0; l < LINES.length; l++) {
        var L = LINES[l], vals = [b[L[0]], b[L[1]], b[L[2]]];
        var cnt = vals.filter(function (v) { return v === m; }).length;
        if (cnt === 2 && vals.indexOf("") !== -1) { return L[vals.indexOf("")]; }
      }
      return -1;
    }
    if (Math.random() < 0.3) { return empty[Math.floor(Math.random() * empty.length)]; }
    var mv = find("O");
    if (mv < 0) { mv = find("X"); }
    if (mv < 0 && !b[4]) { mv = 4; }
    if (mv < 0) {
      var corners = [0, 2, 6, 8].filter(function (i) { return !b[i]; });
      if (corners.length) { mv = corners[Math.floor(Math.random() * corners.length)]; }
    }
    if (mv < 0) { mv = empty[Math.floor(Math.random() * empty.length)]; }
    return mv;
  }

  function xoEnd(w) {
    xo.over = true; xo.busy = false;
    removePokes("cell");
    if (w === "X") { xoStatus("مبروك! فزت بالمباراة."); beep([523, 659, 784, 1046]); burst(0, 1.3, -0.85, accent()); }
    else if (w === "O") { xoStatus("فاز الخصم هذه المرة. جرّب مرة ثانية."); beep([392, 330]); }
    else { xoStatus("تعادل! مباراة قوية."); beep([440, 440]); }
  }

  function xoAnswer(ok, correctLabel) {
    if (!xo.busy || xo.answered) { return; }
    xo.answered = true;
    var token = state.round;
    removePokes("ans");
    if (xo.ansEl && xo.ansEl.parentNode) { xo.ansEl.parentNode.removeChild(xo.ansEl); }
    if (ok) { beep([660, 880, 1100]); xoStatus("إجابة صحيحة! احتللت المربع."); }
    else { beep([240, 180]); xoStatus("إجابة خاطئة. الصحيحة: " + correctLabel + ". ضاع دورك."); }
    setTimeout(function () {
      if (state.round !== token) { return; }
      xo.boardEl.setAttribute("visible", true);
      if (ok) { xoMark(xo.cell, "X"); }
      var w = xoWinner(xo.board);
      if (w) { xoEnd(w); return; }
      setTimeout(function () {
        if (state.round !== token) { return; }
        var m = xoAi();
        xoMark(m, "O");
        beep([330]);
        var w2 = xoWinner(xo.board);
        if (w2) { xoEnd(w2); return; }
        xo.busy = false; xo.answered = false;
        xoStatus("دورك: اختر مربعاً.");
        xoRepoke();
      }, 800);
    }, 1300);
  }

  /* ---------- Per-frame loop: hand touch (pokes) and arm-swing strokes ---------- */
  var handEls = [document.getElementById("lhand"), document.getElementById("rhand")];
  var vA = null, vB = null;
  window.__tick = function (t, dt) {
    if (inVR()) {
      if (!vA) { vA = new AFRAME.THREE.Vector3(); vB = new AFRAME.THREE.Vector3(); }
      var now = performance.now();
      for (var hi = 0; hi < 2; hi++) {
        handEls[hi].object3D.getWorldPosition(vA);
        var list = pokes.slice();
        for (var pi = 0; pi < list.length; pi++) {
          var p = list[pi];
          if (!p.el.parentNode) { continue; }
          p.el.object3D.getWorldPosition(vB);
          var d = vA.distanceTo(vB);
          if (d < p.r) {
            if (p.armed && now - lastPoke > 350) { p.armed = false; lastPoke = now; p.fn(); break; }
          } else if (d > p.r * 1.6) { p.armed = true; }
        }
        if (race.phase === "go" && stroke(race.hands[hi], vA.y)) { race.p += STROKE_STEP; }
      }
    }
    raceTick(dt);
  };

  /* Gaze fallback for headsets without controllers (cardboard-style viewers) */
  var gaze = document.getElementById("gaze");
  function setGaze(on) {
    gaze.setAttribute("visible", on);
    gaze.setAttribute("raycaster", "enabled", on);
  }
  ["lhand", "rhand"].forEach(function (id) {
    document.getElementById(id).addEventListener("controllerconnected", function () { haveCtrl = true; setGaze(false); });
  });
  scene.addEventListener("enter-vr", function () {
    haveCtrl = false;
    setTimeout(function () { if (!haveCtrl && scene.is("vr-mode")) { setGaze(true); } }, 1500);
  });
  scene.addEventListener("exit-vr", function () { setGaze(false); haveCtrl = false; });

  /* Hint line */
  window.addEventListener("pointerdown", function () {
    var h = document.getElementById("hint");
    if (h) { h.classList.add("gone"); }
  }, { once: true });

  /* Fonts: redraw all canvas text once the Arabic faces are ready */
  function redraw() {
    var els = document.querySelectorAll("[ctext]");
    for (var i = 0; i < els.length; i++) {
      var c = els[i].components && els[i].components.ctext;
      if (c && c.draw) { c.draw(); }
    }
  }
  if (document.fonts && document.fonts.load) {
    Promise.all([
      document.fonts.load("600 40px Cairo", "مختبر"),
      document.fonts.load("800 40px Cairo", "مختبر"),
      document.fonts.load("40px Lalezar", "مختبر")
    ]).then(redraw).catch(function () {});
    document.fonts.ready.then(redraw);
  }

  function boot() {
    showIntro();
    window.__booted = true;
    var st = document.getElementById("status");
    if (st) { st.hidden = true; }
  }
  if (scene.hasLoaded) { boot(); } else { scene.addEventListener("loaded", boot); }
})();
</script>
</html>
